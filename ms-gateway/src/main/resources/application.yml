# Gateway de Ferrefix: único punto de entrada público (puerto 8080).
# No guarda secretos: no valida JWT (lo hace cada servicio) ni se conecta a la base de datos.
# AUTH_URL, ARRIENDOS_URL y TIENDA_URL son las direcciones internas de los servicios (docker-compose las define).
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ms-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000     # ms para abrir la conexión con el servicio
            response-timeout: 60s     # las subidas de imágenes (multipart de hasta 6 MB) pueden tardar
          default-filters:
            # El servicio recibe el Host público (el del gateway): así Swagger y las redirecciones usan la URL correcta.
            - PreserveHostHeader
            # Defensa extra: si un servicio llegara a responder con sus propias cabeceras CORS, se conserva solo la del
            # gateway (la primera). Una Access-Control-Allow-Origin duplicada hace que el navegador rechace la respuesta.
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          routes:
            # Autenticación y perfil: ms-auth. Va antes que la ruta general de /api/v1/**.
            - id: ms-auth
              uri: ${AUTH_URL:http://localhost:8081}
              order: 1
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**
            # Arriendo de máquinas: modelos y unidades, arriendos y cotizaciones. Va antes que la ruta general.
            - id: ms-arriendos
              uri: ${ARRIENDOS_URL:http://localhost:8083}
              order: 2
              predicates:
                - Path=/api/v1/maquinas/**,/api/v1/arriendos/**,/api/v1/cotizaciones/**
            # Todo lo demás del contrato público (productos, imágenes y órdenes) y las imágenes servidas en /media/**
            # (incluidas las de las máquinas, que se suben y se sirven desde ms-tienda): ms-tienda.
            - id: ms-tienda
              uri: ${TIENDA_URL:http://localhost:8082}
              order: 3
              predicates:
                - Path=/api/v1/**,/media/**
            # Documento OpenAPI de cada servicio. La interfaz (Swagger UI) vive en el gateway y los lee de aquí.
            - id: docs-ms-auth
              uri: ${AUTH_URL:http://localhost:8081}
              order: 4
              predicates:
                - Path=/api-docs/ms-auth
              filters:
                - RewritePath=/api-docs/ms-auth, /v3/api-docs
            - id: docs-ms-arriendos
              uri: ${ARRIENDOS_URL:http://localhost:8083}
              order: 5
              predicates:
                - Path=/api-docs/ms-arriendos
              filters:
                - RewritePath=/api-docs/ms-arriendos, /v3/api-docs
            - id: docs-ms-tienda
              uri: ${TIENDA_URL:http://localhost:8082}
              order: 6
              predicates:
                - Path=/api-docs/ms-tienda
              filters:
                - RewritePath=/api-docs/ms-tienda, /v3/api-docs

# Swagger UI en /swagger-ui.html con un selector (ms-tienda / ms-arriendos / ms-auth). El gateway no tiene endpoints propios: su
# /v3/api-docs queda vacío y la interfaz muestra los documentos de los servicios (/api-docs/ms-*).
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls-primary-name: ms-tienda      # documento que se muestra al abrir (el selector los ordena por nombre)
    urls:
      - name: ms-tienda
        url: /api-docs/ms-tienda
      - name: ms-arriendos
        url: /api-docs/ms-arriendos
      - name: ms-auth
        url: /api-docs/ms-auth

# CORS vive SOLO aquí (ver CorsConfig). Orígenes del frontend separados por coma.
ferrefix:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Actuator: únicamente health, y solo con el estado (sin detalles ni componentes).
management:
  endpoints:
    web:
      exposure:
        include: health
      discovery:
        enabled: false          # sin el índice /actuator que lista los endpoints
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false          # sin los grupos liveness/readiness: la respuesta es solo {"status":"UP"}
