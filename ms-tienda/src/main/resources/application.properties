spring.application.name=ms-tienda
# Puerto interno: el público (8080) es el del gateway, que reenvía hacia aquí.
server.port=${SERVER_PORT:8082}

# Carga .env si existe (ejecución local sin Docker). En Docker las variables llegan por compose.
# El .env vive en la raíz del repo: se busca ahí (../.env, al ejecutar desde ms-tienda/) y en la carpeta actual.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Detrás del gateway: respeta X-Forwarded-* para que Swagger y las redirecciones usen la URL pública (la del gateway).
server.forward-headers-strategy=framework

# --- Base de datos: esquema propio de este servicio (SIN valores por defecto para credenciales) ---
spring.datasource.url=jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:FREEPDB1}
spring.datasource.username=${TIENDA_DB_USER}
spring.datasource.password=${TIENDA_DB_PASS}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true

# --- JWT (sin valor por defecto: la app no arranca sin JWT_SECRET). Los tokens los emite ms-auth; aquí solo se
# verifica la firma con el mismo secreto, sin llamar a ms-auth. ---
ferrefix.jwt.secret=${JWT_SECRET}

# La autenticación es solo por JWT: no se usa el usuario en memoria (con clave generada) que crea Spring Boot.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# --- OpenAPI (la interfaz Swagger UI la sirve el gateway) ---
springdoc.api-docs.path=/v3/api-docs

# --- Actuator: solo health ---
management.endpoints.web.exposure.include=health

# --- Imágenes subidas por el ADMIN ---
# Carpeta en disco (en Docker: /app/uploads, montada como volumen). Se sirven en /media/**
ferrefix.upload.dir=${FERREFIX_UPLOAD_DIR:./uploads}
ferrefix.upload.max-bytes=6291456
spring.servlet.multipart.max-file-size=${ferrefix.upload.max-bytes}B
spring.servlet.multipart.max-request-size=7MB

# --- Envío de las órdenes: gratis si el subtotal supera 'gratis-sobre'; si no, se cobra 'costo' (CLP) ---
ferrefix.envio.costo=${ENVIO_COSTO:3990}
ferrefix.envio.gratis-sobre=${ENVIO_GRATIS_SOBRE:50000}
