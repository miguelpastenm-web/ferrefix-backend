spring.application.name=ferrefix-backend
server.port=${SERVER_PORT:8080}

# Carga .env si existe (ejecución local sin Docker). En Docker las variables llegan por compose.
spring.config.import=optional:file:.env[.properties]

# --- Base de datos (SIN valores por defecto para credenciales) ---
spring.datasource.url=jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:FREEPDB1}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true

# --- JWT (sin valor por defecto: la app no arranca sin JWT_SECRET) ---
ferrefix.jwt.secret=${JWT_SECRET}
ferrefix.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
ferrefix.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# --- CORS: origen(es) del frontend separados por coma ---
ferrefix.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Swagger ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- Actuator: solo health ---
management.endpoints.web.exposure.include=health

# --- Usuarios iniciales (contraseña SOLO por variable de entorno; vacía = no se crea) ---
ferrefix.seed.admin-email=${ADMIN_EMAIL:admin@ferrefix.cl}
ferrefix.seed.admin-password=${ADMIN_PASSWORD:}
ferrefix.seed.client-email=${CLIENT_EMAIL:cliente@ferrefix.cl}
ferrefix.seed.client-password=${CLIENT_PASSWORD:}

# --- Imágenes subidas por el ADMIN ---
# Carpeta en disco (en Docker: /app/uploads, montada como volumen). Se sirven en /media/**
ferrefix.upload.dir=${FERREFIX_UPLOAD_DIR:./uploads}
ferrefix.upload.max-bytes=6291456
spring.servlet.multipart.max-file-size=${ferrefix.upload.max-bytes}B
spring.servlet.multipart.max-request-size=7MB
