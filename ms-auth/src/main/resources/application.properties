spring.application.name=ms-auth
# Puerto interno: el público (8080) es el del gateway, que reenvía /api/v1/auth/** y /api/v1/users/** hacia aquí.
server.port=${SERVER_PORT:8081}

# Carga .env si existe (ejecución local sin Docker). En Docker las variables llegan por compose.
# El .env vive en la raíz del repo: se busca ahí (../.env, al ejecutar desde ms-auth/) y en la carpeta actual.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Detrás del gateway: respeta X-Forwarded-* para que Swagger y las redirecciones usen la URL pública (la del gateway).
server.forward-headers-strategy=framework

# --- Base de datos: esquema propio de este servicio (SIN valores por defecto para credenciales) ---
spring.datasource.url=jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:FREEPDB1}
spring.datasource.username=${AUTH_DB_USER}
spring.datasource.password=${AUTH_DB_PASS}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true

# --- JWT (sin valor por defecto: la app no arranca sin JWT_SECRET). El mismo secreto lo usan los demás servicios
# para verificar la firma; solo este servicio emite tokens. ---
ferrefix.jwt.secret=${JWT_SECRET}
ferrefix.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
ferrefix.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# La autenticación es solo por JWT: no se usa el usuario en memoria (con clave generada) que crea Spring Boot.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# --- OpenAPI ---
springdoc.api-docs.path=/v3/api-docs

# --- Actuator: solo health ---
management.endpoints.web.exposure.include=health

# --- Usuarios iniciales (contraseña SOLO por variable de entorno; vacía = no se crea) ---
ferrefix.seed.admin-email=${ADMIN_EMAIL:admin@ferrefix.cl}
ferrefix.seed.admin-password=${ADMIN_PASSWORD:}
ferrefix.seed.client-email=${CLIENT_EMAIL:cliente@ferrefix.cl}
ferrefix.seed.client-password=${CLIENT_PASSWORD:}
