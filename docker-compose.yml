# Oracle + la app. Las credenciales vienen de .env (ver .env.example).
services:
  oracle:
    image: gvenzl/oracle-free:slim
    container_name: ferrefix_oracle
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Falta ORACLE_PASSWORD en .env}
      DB_USER: ${DB_USER:?Falta DB_USER en .env}
      DB_PASS: ${DB_PASS:?Falta DB_PASS en .env}
    ports:
      - "127.0.0.1:1521:1521"   # solo local; la app usa la red interna
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./docker/oracle/01-crear-usuario.sh:/container-entrypoint-initdb.d/01-crear-usuario.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 60s

  app:
    build: .
    container_name: ferrefix_app
    restart: unless-stopped
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      DB_HOST: oracle
      DB_PORT: 1521
      DB_SERVICE: FREEPDB1
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ferrefix.cl}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CLIENT_EMAIL: ${CLIENT_EMAIL:-cliente@ferrefix.cl}
      CLIENT_PASSWORD: ${CLIENT_PASSWORD:-}
    ports:
      - "8080:8080"

volumes:
  oracle_data:
