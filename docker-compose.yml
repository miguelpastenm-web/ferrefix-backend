# Oracle + ms-tienda + ms-gateway. Las credenciales vienen de .env (ver .env.example; en producción,
# .env.production.example). Único puerto público: el 8080 del gateway. ms-tienda solo es alcanzable por la red interna.

# Rotación de logs: sin esto crecen sin límite y llenan el disco del servidor.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  oracle:
    image: gvenzl/oracle-free:slim
    container_name: ferrefix_oracle
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Falta ORACLE_PASSWORD en .env}
      DB_USER: ${DB_USER:?Falta DB_USER en .env}
      DB_PASS: ${DB_PASS:?Falta DB_PASS en .env}
    ports:
      - "127.0.0.1:1521:1521"   # solo local; la app usa la red interna
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./docker/oracle/01-crear-usuario.sh:/container-entrypoint-initdb.d/01-crear-usuario.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 60s
    logging: *logging

  # API de la tienda (el monolito). NO publica puertos en el host: se entra siempre por ms-gateway.
  ms-tienda:
    build:
      context: .
      dockerfile: ms-tienda/Dockerfile
    container_name: ferrefix_tienda
    restart: unless-stopped
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      DB_HOST: oracle
      DB_PORT: 1521
      DB_SERVICE: FREEPDB1
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ferrefix.cl}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CLIENT_EMAIL: ${CLIENT_EMAIL:-cliente@ferrefix.cl}
      CLIENT_PASSWORD: ${CLIENT_PASSWORD:-}
      FERREFIX_UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads   # imágenes subidas: sobreviven a recrear el contenedor
    expose:
      - "8082"   # solo red interna de Docker
    # /actuator/health solo devuelve el estado (sin detalles); pasa a UP únicamente si la base responde.
    # La imagen de ejecución (alpine) trae wget de BusyBox, no curl.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    logging: *logging

  # Único punto de entrada: enruta /api/v1/**, /media/** y Swagger hacia ms-tienda, resuelve CORS y responde en JSON
  # los errores de enrutado (404, 502, 504). No conoce secretos: no valida JWT ni usa la base de datos.
  ms-gateway:
    build:
      context: .
      dockerfile: ms-gateway/Dockerfile
    container_name: ferrefix_gateway
    restart: unless-stopped
    depends_on:
      ms-tienda:
        condition: service_healthy
    environment:
      TIENDA_URL: http://ms-tienda:8082
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    # Health PROPIO del gateway (público, solo el estado): indica que el gateway atiende, no el estado de ms-tienda.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging

volumes:
  oracle_data:
  uploads_data:
