# Oracle + la app. Las credenciales vienen de .env (ver .env.example; en producción, .env.production.example).

# Rotación de logs: sin esto crecen sin límite y llenan el disco del servidor.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  oracle:
    image: gvenzl/oracle-free:slim
    container_name: ferrefix_oracle
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Falta ORACLE_PASSWORD en .env}
      DB_USER: ${DB_USER:?Falta DB_USER en .env}
      DB_PASS: ${DB_PASS:?Falta DB_PASS en .env}
    ports:
      - "127.0.0.1:1521:1521"   # solo local; la app usa la red interna
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./docker/oracle/01-crear-usuario.sh:/container-entrypoint-initdb.d/01-crear-usuario.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 60s
    logging: *logging

  app:
    build: .
    container_name: ferrefix_app
    restart: unless-stopped
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      DB_HOST: oracle
      DB_PORT: 1521
      DB_SERVICE: FREEPDB1
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ferrefix.cl}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CLIENT_EMAIL: ${CLIENT_EMAIL:-cliente@ferrefix.cl}
      CLIENT_PASSWORD: ${CLIENT_PASSWORD:-}
      FERREFIX_UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads   # imágenes subidas: sobreviven a recrear el contenedor
    ports:
      - "8080:8080"
    # /actuator/health es público y solo devuelve el estado (sin detalles); pasa a UP únicamente si la base responde.
    # La imagen de ejecución (alpine) trae wget de BusyBox, no curl.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    logging: *logging

volumes:
  oracle_data:
  uploads_data:
